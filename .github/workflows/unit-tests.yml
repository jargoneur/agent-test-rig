name: Unit tests

on:
  push:
    branches:
      - distributed-workers
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.8"
          - "3.12"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest requests PyYAML
      - name: Run scheduler and profile unit tests
        run: >-
          python -m pytest
          test_experiment_jobs.py
          test_scheduler_store.py
          test_model_adapter.py
          test_model_profiles.py
