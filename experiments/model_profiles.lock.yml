status: selected_pending_artifact_hashes
frozen_at: "2026-08-05"
policy_document: docs/model_inference_policy.md
selection_document: docs/model_selection.md

selection_rule:
  primary_profile: exact_checkpoint_bundled_generation_config
  official_sources_only: true
  unofficial_presets_allowed: false
  local_tuning_allowed: false
  design:
    within_family_size_ladder: qwen2_5_coder_instruct
    external_coding_anchors: 4

paired_execution:
  same_profile_across_scaffolds: true
  same_seed_across_scaffolds: true
  same_profile_across_workers: true
  reject_runtime_mismatch: true

common_protocol_limits:
  input_context_tokens: 16384
  max_new_tokens_per_action: 2048
  note: >-
    These are experiment-wide resource limits. They override larger native or
    recommended maximum lengths but do not alter model-specific sampling settings.

runtime:
  backend: llama.cpp_openai_compatible
  backend_repository: ggml-org/llama.cpp
  backend_revision: 6ea215d171fd31df943bf1ac8227129f2b963160
  target_quantization: Q4_K_M
  conversion_status: pending_per_model_validation
  artifact_rule: one_identical_hashed_gguf_per_model_on_every_worker

