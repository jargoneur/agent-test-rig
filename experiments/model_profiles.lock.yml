schema_version: 3
status: family_plan_restored_pending_gemma4_clarification
frozen_at: "2026-08-05"
policy_document: docs/model_inference_policy.md
selection_document: docs/model_selection.md

selection_rule:
  source: supervisor_recommendation
  target_model_count: 10
  families:
    qwen3_5: 6
    gemma4: 4
  official_sources_only: true
  unofficial_presets_allowed: false
  local_tuning_allowed: false

paired_execution:
  same_profile_across_scaffolds: true
  same_seed_across_scaffolds: true
  same_profile_across_workers: true
  reject_runtime_mismatch: true

hardware_envelope:
  gpu_vram_gib: 32
  weight_quantization_target: int8
  kv_cache_precision_target: fp16
  cpu_offload_allowed: false
  include_prefill_peak_in_validation: true
  require_runtime_safety_margin: true

common_protocol_limits:
  input_context_tokens: null
  max_new_tokens_per_action: 2048

runtime:
  backend: pending_validation
  backend_revision: pending_validation
  target_quantization: int8
  artifact_rule: one_identical_hashed_artifact_per_model_on_every_worker

