validation_gate:
  benchmark_runs_allowed: false
  validation_smokes_allowed: true
  unblock_when:
    - all_eleven_source_revisions_resolve
    - official_generation_profiles_are_recorded
    - every_model_and_tokenizer_hash_is_recorded
    - every_chat_template_hash_is_recorded
    - int8_artifacts_are_validated
    - fp16_kv_cache_is_validated
    - measured_peak_vram_including_prefill_is_recorded
    - deployment_constraints_are_explicitly_resolved
    - every_quantized_artifact_hash_is_recorded
    - every_profile_hash_is_recorded
    - distributed_current_head_smoke_passes
