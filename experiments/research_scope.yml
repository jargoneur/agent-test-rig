schema_version: 2
frozen_at: "2026-08-05"
policy_document: docs/research_scope_and_resource_policy.md

minimum_successful_result:
  status: required
  source: professor_alexander_eck_and_prior_project_plan
  model_count: 10
  model_families:
    qwen3_5: 6
    gemma4: 4
  benchmark:
    name: ContextBench
    frozen_task_count: 150
  main_scaffold_count: 4
  repeats: 3
  expected_run_count: 18000
  expected_run_count_formula: "10 * 150 * 4 * 3"
  estimated_gpu_hours_per_model: 50
  estimated_gpu_hours_total: 500
  includes_prefill_cost: true
  pilot_counts_as_result: false
  partial_family_counts_as_result: false
  reduced_task_or_scaffold_set_counts_as_result: false

execution_waves:
  - id: validation
    research_result: false
    purpose:
      - technical_integration
      - protocol_validation
      - memory_and_prefill_validation
      - resource_yield_validation
  - id: minimum_core
    research_result: true
    purpose: complete_all_18000_frozen_core_runs
  - id: optional_expansion
    research_result: supplementary
    append_only: true
    allowed_when: does_not_endanger_minimum_core
    protocol_amendment_required: true
    candidate_dimensions:
      - lower_difficulty_real_tasks_and_easy_anchors
      - additional_hard_tasks
      - handbook_delayed_constraints
      - handbook_distractors
      - handbook_prohibited_action_checks
      - ecbd_validated_variants
      - oracle_context_diagnostics
      - matched_noise_controls
      - task_difficulty_metadata
      - scaffold_taxonomy_and_ablations
      - additional_models
      - additional_repeats
    region_labels:
      - baseline_solvable
      - scaffold_sensitive
      - scaffold_enabled
      - oracle_only
      - capability_limited

shared_resource_policy:
  other_users_priority: true
  project_access_mode: opportunistic
  explicit_policy_required_for_every_worker: true
  production_priority_verification_required: true
  written_verification_reference_required: true
  permitted_modes:
    - scheduler_preemptible
    - external_yield_signal
  release_mechanism_required: true
  preserve_completed_runs_on_yield: true
  requeue_incomplete_blocks_on_yield: true
  release_model_server_and_allocation_on_yield: true
  cooperative_checkpoints:
    - before_worker_registration
    - before_block_claim
    - before_job_setup
    - before_prompt_construction
    - before_model_call
    - after_model_call
    - before_tool_action
    - before_final_tests
  limitation: cooperative_yield_cannot_interrupt_an_active_model_call_or_tool_process
