schema_version: 3
frozen_at: "2026-08-06"
policy_document: docs/research_scope_and_resource_policy.md
analysis_document: docs/analysis_protocol.md

minimum_successful_result:
  status: required
  source: user_protocol_decision_two_complete_families
  model_count: 11
  model_families:
    qwen3_5: 6
    gemma4: 5
  benchmark:
    name: ContextBench
    frozen_task_count: 150
  main_scaffold_count: 5
  repeats: 3
  expected_run_count: 24750
  expected_run_count_formula: "11 * 150 * 5 * 3"
  cost_is_research_factor: false
  runtime_and_resource_telemetry: operational_only
  pilot_counts_as_result: false
  partial_family_counts_as_result: false
  reduced_task_or_scaffold_set_counts_as_result: false

model_family_members:
  qwen3_5:
    - Qwen/Qwen3.5-0.8B
    - Qwen/Qwen3.5-2B
    - Qwen/Qwen3.5-4B
    - Qwen/Qwen3.5-9B
    - Qwen/Qwen3.5-27B
    - Qwen/Qwen3.5-35B-A3B
  gemma4:
    - google/gemma-4-E2B-it
    - google/gemma-4-E4B-it
    - google/gemma-4-12B-it
    - google/gemma-4-26B-A4B-it
    - google/gemma-4-31B-it

execution_waves:
  - id: validation
    research_result: false
    purpose:
      - technical_integration
      - protocol_validation
      - memory_and_prefill_validation
      - distributed_recovery_validation
      - cooperative_pause_validation
  - id: minimum_core
    research_result: true
    purpose: complete_all_24750_frozen_core_runs
  - id: optional_expansion
    research_result: supplementary
    append_only: true
    allowed_when: does_not_endanger_minimum_core
    protocol_amendment_required: true
    candidate_dimensions:
      - lower_difficulty_real_tasks_and_easy_anchors
      - additional_hard_tasks
      - handbook_delayed_constraints
      - handbook_distractors
      - handbook_prohibited_action_checks
      - ecbd_validated_variants
      - oracle_context_diagnostics
      - matched_noise_controls
      - task_difficulty_metadata
      - scaffold_taxonomy_and_ablations
      - additional_models
      - additional_repeats
    region_labels:
      - baseline_solvable
      - scaffold_sensitive
      - scaffold_enabled
      - oracle_only
      - capability_limited

plato_resource_policy:
  permission_status: confirmed
  permission_reference: prof_eck_permission_compute_until_contact_2026-08-05
  permission_rule: computation_allowed_until_professor_contacts_user
  external_interest_management_system: false
  mode: manual_operator
  automatic_preemption_claimed: false
  manual_supervision_required: true
  central_pause_required: true
  preserve_completed_runs_on_yield: true
  requeue_incomplete_blocks_on_yield: true

worker_resource_modes:
  - local_exclusive
  - scheduler_preemptible
  - external_yield_signal
  - manual_operator

cooperative_checkpoints:
  - before_worker_registration
  - before_block_claim
  - before_job_setup
  - before_prompt_construction
  - before_model_call
  - after_model_call
  - before_tool_action
  - before_final_tests

limitations:
  - cooperative_pause_cannot_interrupt_active_model_call_or_tool_process
  - manual_operator_mode_cannot_detect_uncommunicated_external_demand
